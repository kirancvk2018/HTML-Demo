<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Rack Rescue: PCEP Practice Game</title><style>
:root{--bg:#070d1a;--panel:#101a30;--panel2:#16233f;--line:#27395f;--ink:#eaf1ff;--mut:#9db0d3;--cyan:#38e1ff;--blue:#3b82f6;--good:#35e08a;--bad:#ff6b7a;--gold:#ffd166;--violet:#a78bfa;--mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#17306155,transparent),var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
#hud{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:#0a1224ee;border-bottom:1px solid var(--line)}
#hud .logo{font-weight:800;letter-spacing:.5px;cursor:pointer;margin-right:auto}.logo b{color:var(--cyan)}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap}
main{max-width:1020px;margin:0 auto;padding:20px 16px 60px;position:relative}
h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:10px 0}h2{margin:6px 0 10px}h3{margin:4px 0 8px}
.grad{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut)}.small{font-size:13px}
.card{background:linear-gradient(180deg,var(--panel),#0e172b);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #0006}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.grid .card{margin:0}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--cyan)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:linear-gradient(90deg,#1d6fe0,#0ea5c6);border:0;font-weight:700}
input[type=text],textarea{font:inherit;background:#050a15;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
pre.code{background:#04080f;border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:10px;padding:14px;overflow-x:auto;font:14px/1.7 var(--mono);white-space:pre}
.kw{color:#c792ea}.st{color:#a5e075}.nu{color:#ffb86c}.fn{color:#67d4ff}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-family:var(--mono);white-space:pre-wrap}
.opt.sel{border-color:var(--cyan);background:#12345a}.opt.ok,.ok-b{border-color:var(--good)!important;background:#0d3b2a!important}.opt.no,.no-b{border-color:var(--bad)!important;background:#47172430!important}.opt.gone{opacity:.25;text-decoration:line-through}
.fb{border-radius:12px;padding:12px 16px;margin-top:12px;border:1px solid}.fb.ok{border-color:var(--good);background:#0d3b2a}.fb.no{border-color:var(--bad);background:#43161f}
.fb pre{margin:6px 0;white-space:pre-wrap;font-family:var(--mono)}
.bar{height:8px;background:#050a15;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--good))}
.zone{border-top:4px solid var(--c)}.station{display:flex;justify-content:space-between;gap:8px;width:100%;margin:6px 0;text-align:left}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan)}
.seg button.on{background:var(--cyan);color:#04101c;font-weight:700}
.badge{display:inline-block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px;opacity:.35;font-size:13px}.badge.got{opacity:1;border-color:var(--gold);box-shadow:0 0 14px #ffd16633}
/* puzzle-shaped tiles */
.slot{display:inline-block;min-width:84px;min-height:26px;border:2px dashed var(--cyan);border-radius:6px;vertical-align:middle;text-align:center;cursor:pointer;padding:0 8px;margin:0 3px;white-space:pre}
.slot.full{border-style:solid;background:#12345a}
.tile{position:relative;display:inline-block;font:700 15px var(--mono);background:linear-gradient(180deg,#2563eb,#1e40af);padding:10px 22px 10px 26px;border-radius:7px;margin:6px 14px 6px 0;cursor:grab;touch-action:none;user-select:none;white-space:pre}
.tile:after{content:"";position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#1f4fc4}
.tile:before{content:"";position:absolute;left:-1px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#101a30}
.tile.sel,.blk.sel,.chipx.sel{outline:3px solid var(--gold)}.tile.used{opacity:.25}
.blk{position:relative;display:flex;gap:8px;align-items:center;background:#1b2c55;border:1px solid #4668ad;border-radius:8px;padding:10px 12px;margin:0 0 12px;touch-action:none;cursor:grab;user-select:none}
.blk:after{content:"";position:absolute;bottom:-11px;left:34px;width:26px;height:11px;border-radius:0 0 13px 13px;background:#1b2c55;border:1px solid #4668ad;border-top:0;z-index:1}
.blk:last-child:after{display:none}.blk code{flex:1;font:14px var(--mono);white-space:pre;overflow-x:auto}.blk button{padding:2px 10px}
.ghost{position:fixed!important;pointer-events:none;z-index:99;opacity:.9;transform:rotate(-3deg);margin:0!important}
/* jigsaw */
.jwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}@media(max-width:760px){.jwrap{grid-template-columns:1fr}}
.board{position:relative;width:100%;aspect-ratio:3/2;background:#050a15;border:2px solid var(--line);border-radius:10px}
.cell{position:absolute;width:33.333%;height:50%;border:1px dashed #3a5488;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;cursor:pointer;font:600 13px var(--mono);overflow:hidden;white-space:pre-wrap}
.cell:hover{background:#12264a}.cell.done{border:0;background:none;pointer-events:none}
.board svg{position:absolute;pointer-events:none;filter:drop-shadow(0 0 3px #000a);overflow:visible}
.tray{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chipx{border:0;background:none;padding:0;width:140px;height:88px;position:relative;cursor:grab;touch-action:none;user-select:none}
.chipx svg{width:100%;height:100%}.chipx span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 13px var(--mono);padding:14px;text-align:center;word-break:break-word}
.free{position:relative;width:100%;touch-action:none;background:#050a15;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.free svg{position:absolute;cursor:grab;overflow:visible;touch-action:none;pointer-events:none}.free svg path.hit{pointer-events:all}
.cells{display:flex;flex-wrap:wrap;gap:4px}.cells button{width:48px;height:62px;padding:2px;font:700 20px var(--mono)}.cells small{display:block;font-size:10px;color:var(--mut)}
.bits{display:flex;gap:6px;flex-wrap:wrap}.bits button{width:56px;font:700 22px var(--mono)}.bits button.on{background:var(--cyan);color:#001}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.bin{border:2px dashed var(--line);border-radius:12px;min-height:100px;padding:10px;text-align:center;cursor:pointer}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mem button{min-height:84px;font:600 13px var(--mono);word-break:break-word}@media(max-width:600px){.mem{grid-template-columns:repeat(3,1fr)}}
.nav-q{width:40px;padding:6px 0}.nav-q.ans{background:#1d4ed8}.nav-q.flag{border-color:var(--gold);border-width:2px}.nav-q.cur{outline:2px solid var(--cyan)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}.tw{overflow-x:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#07101f;padding:10px 18px;border-radius:99px;font-weight:700;z-index:50;display:none;max-width:92vw}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.conf{display:none}}
</style></head><body><header id="hud"></header><main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<script>const DATA={"Q": [{"t": "mc", "s": 1, "v": "b", "obj": "Operators", "q": "What is the output of this code?", "code": "print(2 ** 3 ** 2)", "o": ["512", "64", "72", "36"], "a": [0], "e": "** is right-associative: 3**2 = 9, then 2**9 = 512.", "run": true, "id": "q0"}, {"t": "mc", "s": 1, "v": "b", "obj": "Operators", "q": "What is the output of this code?", "code": "print(-7 // 2, -7 % 2)", "o": ["-4 1", "-3 -1", "-3 1", "-4 -1"], "a": [0], "e": "// rounds toward negative infinity. % takes the sign of the divisor.", "run": true, "id": "q1"}, {"t": "mc", "s": 1, "v": "b", "obj": "Operators", "q": "What is the output of this code?", "code": "print(1 + 7 / 2 * 2)", "o": ["8.0", "8", "4.5", "2.75"], "a": [0], "e": "/ and * run left to right and / always returns a float.", "run": true, "id": "q2"}, {"t": "mc", "s": 1, "v": "b", "obj": "Console I/O", "q": "What is the output of this code? The user types 8 and then 5.", "code": "a = input()\nb = input()\nprint(a + b)", "o": ["85", "13", "8 5", "TypeError"], "a": [0], "e": "input() returns str, so + joins the two strings.", "run": true, "id": "q3"}, {"t": "mc", "s": 1, "v": "b", "obj": "Console I/O", "q": "What is the output of this code?", "code": "print(\"iDRAC\", \"PowerEdge\", sep=\"-\", end=\"!\")\nprint(\"OK\")", "o": ["iDRAC-PowerEdge!OK", "iDRAC-PowerEdge!\nOK", "iDRAC PowerEdge!OK", "iDRAC-PowerEdge-!OK"], "a": [0], "e": "sep goes between values. end replaces the newline.", "run": true, "id": "q4"}, {"t": "mc", "s": 1, "v": "b", "obj": "Floating point", "q": "What is the output of this code?", "code": "print(0.1 + 0.2 == 0.3)", "o": ["False", "True", "0.3", "SyntaxError"], "a": [0], "e": "Binary floating point cannot store 0.1 or 0.2 exactly.", "run": true, "id": "q5"}, {"t": "mc", "s": 1, "v": "b", "obj": "Operators", "q": "What is the output of this code?", "code": "print(\"=\" * 3 + \">\" * 2)", "o": ["===>>", "=3>2", "=== >>", "TypeError"], "a": [0], "e": "* repeats a string and + concatenates.", "run": true, "id": "q6"}, {"t": "mc", "s": 1, "v": "b", "obj": "Boolean logic", "q": "What is the output of this code?", "code": "print(not 0 and 5 or 7)", "o": ["5", "True", "7", "False"], "a": [0], "e": "(not 0) is True; True and 5 gives 5; 5 or 7 gives 5.", "run": true, "id": "q7"}, {"t": "mc", "s": 1, "v": "b", "obj": "Type casting", "q": "What is the output of this code?", "code": "print(int(3.99), int(-3.99), float(\"7\"))", "o": ["3 -3 7.0", "4 -4 7.0", "3 -4 7", "3 -3 7"], "a": [0], "e": "int() truncates toward zero.", "run": true, "id": "q8"}, {"t": "mc", "s": 1, "v": "b", "obj": "Language basics", "q": "A script is syntactically valid but computes disk usage with + where - was intended. What kind of error is this?", "code": "", "o": ["Semantic (logic) error", "Lexical error", "Syntax error", "Indentation error"], "a": [0], "e": "The code runs, but its meaning is wrong.", "run": false, "id": "q9"}, {"t": "mc", "s": 1, "v": "b", "obj": "Language basics", "q": "Which statement correctly compares a compiler with an interpreter?", "code": "", "o": ["A compiler translates the whole program before it runs; an interpreter processes it while it runs", "An interpreter translates the whole program before it runs; a compiler processes it while it runs", "A compiler must translate the source again on every run; an interpreter translates it only once", "A compiler reports syntax errors only during execution; an interpreter never reports them"], "a": [0], "e": "This is the classic model: translation ahead of time versus processing during execution.", "run": false, "id": "q10"}, {"t": "multi", "s": 1, "v": "b", "obj": "Naming", "q": "Select TWO valid variable names.", "code": "", "e": "Names start with a letter or underscore, contain no hyphens, and cannot be keywords.", "id": "q11", "o": ["rack_01", "1st_rack", "_health", "power-state", "class"], "a": [0, 2]}, {"t": "multi", "s": 1, "v": "b", "obj": "Literals", "q": "Select ALL expressions that evaluate to True.", "code": "", "e": "'False' is a non-empty string, so it is truthy. int('3.5') raises ValueError.", "id": "q12", "o": ["type(10 / 5) is float", "type(7 // 2) is int", "type(7 // 2.0) is int", "bool('False') == True", "int('3.5') == 3"], "a": [0, 1, 3]}, {"t": "gap", "s": 1, "v": "b", "obj": "Console I/O", "q": "Fill the gap with a type-conversion function so the program prints 42 when the user types 21.", "code": "n = ___(input())\nprint(n * 2)", "a": [["int"]], "expect": "42", "e": "input() gives text; int() converts it before the maths.", "id": "q13"}, {"t": "dnd", "s": 1, "v": "b", "obj": "Operators", "q": "Drag the operators into place to print the full racks and the leftover drives.", "code": "drives = 29\nper_rack = 12\nprint(drives ___ per_rack, drives ___ per_rack)", "a": ["//", "%"], "tiles": ["//", "%", "/", "**"], "expect": "2 5", "e": "// gives whole groups; % gives the remainder.", "id": "q14"}, {"t": "mc", "s": 1, "v": "b", "obj": "Operators", "q": "What is the output of this code?", "code": "x = 10\nx -= 3\nx *= 2 + 1\nprint(x)", "o": ["21", "15", "22", "14"], "a": [0], "e": "x *= 2 + 1 means x = x * (2 + 1).", "run": true, "id": "q15"}, {"t": "mc", "s": 1, "v": "2", "obj": "Numeral systems", "q": "What is the output of this code?", "code": "print(0o17 + 0x1A + 0b101)", "o": ["46", "41", "48", "132"], "a": [0], "e": "0o17 = 15, 0x1A = 26, 0b101 = 5.", "run": true, "id": "q16"}, {"t": "mc", "s": 1, "v": "2", "obj": "Bitwise", "q": "What is the output of this code?", "code": "print(12 & 10, 12 | 10, 12 ^ 10)", "o": ["8 14 6", "10 12 2", "8 14 2", "22 0 6"], "a": [0], "e": "12 = 1100 and 10 = 1010. Compare bit by bit.", "run": true, "id": "q17"}, {"t": "mc", "s": 1, "v": "2", "obj": "Bitwise", "q": "What is the output of this code?", "code": "print(5 << 2, 20 >> 3)", "o": ["20 2", "10 3", "7 17", "20 3"], "a": [0], "e": "<< n multiplies by 2**n; >> n floor-divides by 2**n.", "run": true, "id": "q18"}, {"t": "mc", "s": 1, "v": "2", "obj": "Literals", "q": "What is the output of this code?", "code": "print(3e2, 25E-1)", "o": ["300.0 2.5", "300 2.5", "3e2 25E-1", "9 23"], "a": [0], "e": "Scientific notation always creates a float.", "run": true, "id": "q19"}, {"t": "mc", "s": 1, "v": "2", "obj": "Bitwise", "q": "What is the output of this code?", "code": "print(~9)", "o": ["-10", "-9", "6", "10"], "a": [0], "e": "~x equals -x - 1.", "run": true, "id": "q20"}, {"t": "mc", "s": 2, "v": "b", "obj": "Conditionals", "q": "What is the output of this code?", "code": "temp = 81\nif temp > 60:\n    print(\"WARM\")\nelif temp > 75:\n    print(\"HOT\")\nelse:\n    print(\"OK\")", "o": ["WARM", "HOT", "WARM\nHOT", "OK"], "a": [0], "e": "Only the first true branch runs. The HOT branch is unreachable.", "run": true, "id": "q21"}, {"t": "mc", "s": 2, "v": "b", "obj": "Conditionals", "q": "What is the output of this code?", "code": "cpu = 40\nfan = False\nif cpu > 30:\n    if fan:\n        print(\"A\")\n    else:\n        print(\"B\")\nprint(\"C\")", "o": ["B\nC", "A\nC", "B", "C"], "a": [0], "e": "The inner else runs, then the unindented print always runs.", "run": true, "id": "q22"}, {"t": "mc", "s": 2, "v": "b", "obj": "range()", "q": "What is the output of this code?", "code": "for i in range(10, 2, -3):\n    print(i, end=' ')", "o": ["10 7 4", "10 7 4 1", "10 7", "7 4"], "a": [0], "e": "The stop value 2 is excluded.", "run": true, "id": "q23"}, {"t": "mc", "s": 2, "v": "b", "obj": "range()", "q": "How many times is the body of this loop executed?", "code": "for i in range(1, 12, 4):\n    pass", "o": ["3", "2", "4", "11"], "a": [0], "e": "The values are 1, 5 and 9.", "run": false, "id": "q24"}, {"t": "mc", "s": 2, "v": "b", "obj": "while loops", "q": "What is the output of this code?", "code": "n = 1\nwhile n < 20:\n    n = n * 3\nprint(n)", "o": ["27", "9", "19", "81"], "a": [0], "e": "n goes 1, 3, 9, 27. The test fails at 27.", "run": true, "id": "q25"}, {"t": "mc", "s": 2, "v": "b", "obj": "Loop control", "q": "What is the output of this code (4)", "12"], ["def f(a, b=3):\n    return a * b", "f(4, 5)", "20"], ["def f(a, b=3):\n    return a * b", "f(b=2, a='x')", "'xx'"], ["def g():\n    pass", "g()", "None"], ["def h(n):\n    return n, n + 1", "h(1)", "(1, 2)"], ["def k(v):\n    v.append(0)\n    return len(v)", "k([7, 7])", "3"]], "5": [["import math", "math.ceil(4.1)", "5"], ["import math", "math.floor(4.9)", "4"], ["import math", "math.sqrt(49)", "7.0"], ["import math", "math.trunc(-4.9)", "-4"], ["import csv", "next(csv.reader(['a,1']))", "['a', '1']"], ["import random", "len(random.sample(range(9), 2))", "2"]]}, "slices": [{"seq": "IDRAC9HEALTH", "sl": "[0:5]", "idx": [0, 1, 2, 3, 4], "res": "IDRAC"}, {"seq": "IDRAC9HEALTH", "sl": "[-6:]", "idx": [6, 7, 8, 9, 10, 11], "res": "HEALTH"}, {"seq": "IDRAC9HEALTH", "sl": "[::3]", "idx": [0, 3, 6, 9], "res": "IAHL"}, {"seq": "IDRAC9HEALTH", "sl": "[8:2:-2]", "idx": [8, 6, 4], "res": "AHC"}, {"seq": "IDRAC9HEALTH", "sl": "[::-4]", "idx": [11, 7, 3], "res": "HEA"}], "lits": [["42", "int"], ["'42'", "str"], ["4.2", "float"], ["True", "bool"], ["4e2", "float"], ["'True'", "str"], ["0", "int"], ["-7.0", "float"], ["False", "bool"], ["''", "str"]], "bits": [["12 & 10", 8], ["12 | 3", 15], ["14 ^ 5", 11], ["3 << 4", 48], ["200 >> 2", 50]], "trace": [{"v": "b", "code": "free = 100\nfor job in [30, 25, 60]:\n    if job > free:\n        print('skip', job)\n        continue\n    free -= job\n    print('left', free)", "lines": ["left 70", "left 45", "skip 60"]}, {"v": "b", "code": "n = 13\nwhile n > 1:\n    n //= 2\n    print(n)", "lines": ["6", "3", "1"]}, {"v": "b", "code": "for r in range(1, 4):\n    line = ''\n    for c in range(r):\n        line += str(c)\n    print(line)", "lines": ["0", "01", "012"]}], "triage": [["b", "int('v2')", "ValueError"], ["b", "'rack' + 1", "TypeError"], ["b", "1 % 0", "ZeroDivisionError"], ["b", "[1, 2][2]", "IndexError"], ["b", "{'a': 1}['b']", "KeyError"], ["b", "unknown_host", "NameError"], ["b", "len(5)", "TypeError"], ["b", "float('up')", "ValueError"]], "bugs": [{"v": "b", "lines": ["temps = [61, 72, 90]", "hot = 0", "for t in temps", "    if t > 70:", "        hot += 1", "print(hot)"], "k": 2, "fix": "for t in temps:"}, {"v": "b", "lines": ["def avg(v):", "    return sum(v) / len(v)", "data = [2, 4]", "print(avg[data])"], "k": 3, "fix": "print(avg(data))"}, {"v": "b", "lines": ["ids = [1, 2, 3]", "total = 0", "for i in range(len(ids) + 1):", "    total += ids[i]", "print(total)"], "k": 2, "fix": "for i in range(len(ids)):"}, {"v": "b", "lines": ["state = 'down'", "if state = 'down':", "    print('page')"], "k": 1, "fix": "if state == 'down':"}, {"v": "b", "lines": ["count = 3", "msg = 'alerts: ' + count", "print(msg)"], "k": 1, "fix": "msg = 'alerts: ' + str(count)"}], "tf": [["b", "'5' * 3 gives '555'", true], ["b", "A tuple has an append() method", false], ["b", "input() can return an int directly", false], ["b", "range(5) includes 5", false], ["b", "10 / 2 is a float", true], ["b", "d.keys() lists a dictionary's keys as a view", true], ["b", "A string can be changed in place", false], ["b", "A function with no return gives None", true], ["b", "else may follow an if without any elif", true], ["b", "'a' in 'cat' is True", true], ["b", "list.sort() returns a new list", false], ["b", "-1 is the index of the last item", true], ["3", "{} is an empty set", false], ["3", "*args is a tuple", true], ["3", "Mode 'w' keeps old file content", false], ["2", "KeyError is a kind of LookupError", true], ["2", "A while loop cannot have an else", false], ["2", "0b11 equals 3", true]]};</script><script>
"use strict";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hl=src=>src.replace(/(___)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")|\b(def|return|if|elif|else|for|while|in|not|and|or|try|except|import|with|as|break|continue|pass|global|yield|True|False|None)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_]\w*)(?=\()|([\s\S])/g,
 (m,gap,s,k,n,f,o)=>gap?gap:s?`<span class="st">${esc(s)}</span>`:k?`<span class="kw">${k}</span>`:n?`<span class="nu">${n}</span>`:f?`<span class="fn">${f}</span>`:esc(o));
const codeBlock=c=>c?`<pre class="code">${hl(c)}</pre>`:"";

const ZONES=[
{s:1,n:"Boot Bay",c:"#38e1ff",t:"Python fundamentals",story:"A new rack will not boot. Bring the basics online.",art:"BOOT OK",
 job:'# Illustrative: inventory values often arrive as text\nraw_watts = "750"\ncount = int("4")\nprint("Total W:", int(raw_watts) * count)'},
{s:2,n:"Packet Maze",c:"#a78bfa",t:"Control flow",story:"Health checks are looping the wrong way. Route them.",art:"ROUTES CLEAR",
 job:'# Illustrative: scan nodes and report the unhealthy ones\nfor node, health in [("n1", "OK"), ("n2", "Critical")]:\n    if health == "OK":\n        continue\n    print("Open ticket for", node)'},
{s:3,n:"Storage Vault",c:"#35e08a",t:"Data collections",story:"Inventory data is scrambled. Rebuild the vault.",art:"VAULT ONLINE",
 job:'# Illustrative: Redfish-style replies become nested dicts\nserver = {"PowerState": "On", "Status": {"Health": "OK"}}\nprint(server.get("PowerState"), server["Status"]["Health"])'},
{s:4,n:"Firewall Core",c:"#ff9f6b",t:"Functions and exceptions",story:"One bad reading crashes the whole script. Contain it.",art:"CORE SHIELDED",
 job:'# Illustrative: one bad reading must not stop the whole run\ndef parse_temp(text):\n    try:\n        return int(text)\n    except ValueError:\n        return None\nprint([parse_temp("24"), parse_temp("N/A")])'},
{s:5,n:"Archive Deck",c:"#ffd166",t:"Files and modules",story:"The shift report must be saved before handover.",art:"LOGS SAVED",only:"3",
 job:'# Illustrative: write a shift report\nimport csv\nwith open("shift_report.csv", "w", newline="") as f:\n    out = csv.writer(f)\n    out.writerow(["node", "health"])\n    out.writerow(["n2", "Critical"])'}];
const WEIGHT={"2":[7,8,7,8],"3":[6,8,9,7,5]}, MINUTES={"2":40,"3":50};

const KEY="rackRescue.v1";
const fresh=()=>({name:"",ver:"3",xp:0,streak:0,best:0,done:{},topics:{},badges:{},mocks:[],used:[],sound:true});
let S=fresh();try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const inVer=x=>x==="b"||x===S.ver;
const zones=()=>ZONES.filter(z=>!z.only||z.only===S.ver);
const pool=s=>DATA.Q.filter(q=>q.s===s&&inVer(q.v));

let AC;function beep(f,d=.09,when=0){if(!S.sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok(){beep(660);beep(990,.14,.08)},no(){beep(180,.2)},snap(){beep(440,.05)},win(){[523,659,784,1046].forEach((f,i)=>beep(f,.18,i*.1))}};
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(tT);tT=setTimeout(()=>t.style.display="none",2400)}
function confetti(){for(let i=0;i<80;i++){const c=el("i","conf");c.style.left=Math.random()*100+"vw";c.style.background=["#38e1ff","#a78bfa","#35e08a","#ffd166","#ff6b7a"][i%5];c.style.animationDelay=Math.random()*.6+"s";document.body.append(c);setTimeout(()=>c.remove(),2800)}}
function badge(id){if(!S.badges[id]){S.badges[id]=1;toast("Badge unlocked: "+BADGES[id][0]);save()}}
const BADGES={first:["First Fix","First correct answer"],streak:["Hot Streak","5 correct in a row"],jig:["Puzzle Master","Solve an answer jigsaw with no misses"],free:["Fast Hands","Rebuild a picture puzzle"],clean:["Zero Downtime","Quiz run with all 3 shields intact"],bug:["Bug Slayer","Finish the bug hunt"],mock:["Exam Ready","Score 70% or more in a mock"],ace:["Rack Legend","Score 90% or more in a mock"]};
function award(ok,base=100){if(ok){S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=base+Math.min(S.streak-1,5)*10;badge("first");if(S.streak>=5)badge("streak");sfx.ok()}else{S.streak=0;sfx.no()}save();hud()}
function track(q,ok){const k=q.obj,t=S.topics[k]||(S.topics[k]=[0,0]);t[0]+=ok?1:0;t[1]++;save()}
